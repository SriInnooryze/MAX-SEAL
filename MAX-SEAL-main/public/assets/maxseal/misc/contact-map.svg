<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="cmt cmd">
  <title id="cmt">Facility location — Lumberton, North Carolina</title>
  <desc id="cmd">Stylized map graphic marking Max-Seal's Lumberton, North Carolina facility. Decorative, not a literal street map.</desc>
  <defs>
    <linearGradient id="cm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15191c"/>
      <stop offset="100%" stop-color="#0c0f11"/>
    </linearGradient>
    <radialGradient id="cm-glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#009fda" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#009fda" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#cm-bg)"/>
  <rect width="800" height="600" fill="url(#cm-glow)"/>

  <!-- abstract block/street grid -->
  <g stroke="#3a434a" stroke-width="1.5" opacity="0.55">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="230" x2="800" y2="230"/>
    <line x1="0" y1="330" x2="800" y2="330"/>
    <line x1="0" y1="430" x2="800" y2="430"/>
    <line x1="0" y1="520" x2="800" y2="520"/>
    <line x1="110" y1="0" x2="110" y2="600"/>
    <line x1="260" y1="0" x2="260" y2="600"/>
    <line x1="430" y1="0" x2="430" y2="600"/>
    <line x1="580" y1="0" x2="580" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
  </g>
  <g stroke="#2a3137" stroke-width="1" opacity="0.5">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="175" x2="800" y2="175"/>
    <line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="0" y1="380" x2="800" y2="380"/>
    <line x1="0" y1="475" x2="800" y2="475"/>
    <line x1="55" y1="0" x2="55" y2="600"/>
    <line x1="185" y1="0" x2="185" y2="600"/>
    <line x1="345" y1="0" x2="345" y2="600"/>
    <line x1="505" y1="0" x2="505" y2="600"/>
    <line x1="640" y1="0" x2="640" y2="600"/>
    <line x1="750" y1="0" x2="750" y2="600"/>
  </g>

  <!-- city blocks -->
  <g fill="#1e2429" opacity="0.85">
    <rect x="130" y="140" width="110" height="70" rx="3"/>
    <rect x="290" y="140" width="120" height="70" rx="3"/>
    <rect x="450" y="140" width="110" height="70" rx="3"/>
    <rect x="600" y="140" width="80" height="70" rx="3"/>
    <rect x="130" y="250" width="110" height="60" rx="3"/>
    <rect x="450" y="250" width="110" height="60" rx="3"/>
    <rect x="600" y="250" width="80" height="60" rx="3"/>
    <rect x="130" y="350" width="110" height="60" rx="3"/>
    <rect x="290" y="350" width="120" height="60" rx="3"/>
    <rect x="600" y="350" width="80" height="60" rx="3"/>
    <rect x="130" y="450" width="110" height="50" rx="3"/>
    <rect x="290" y="450" width="120" height="50" rx="3"/>
    <rect x="450" y="450" width="110" height="50" rx="3"/>
  </g>

  <!-- facility footprint (highlighted block) -->
  <rect x="290" y="250" width="120" height="60" rx="3" fill="#0089c2" opacity="0.28" stroke="#009fda" stroke-width="1.5"/>

  <!-- pin -->
  <g transform="translate(350,240)">
    <ellipse cx="0" cy="60" rx="20" ry="6" fill="#000000" opacity="0.35"/>
    <path d="M0 -46c-19 0-34 15-34 34 0 25 34 62 34 62s34-37 34-62c0-19-15-34-34-34z" fill="#009fda"/>
    <circle cx="0" cy="-12" r="13" fill="#f1f4f5"/>
  </g>

  <!-- label card -->
  <g transform="translate(48,48)">
    <rect width="298" height="70" rx="4" fill="#0c0f11" opacity="0.72" stroke="#2a3137"/>
    <text x="20" y="28" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="11" letter-spacing="2" fill="#38b4e6">FACILITY &amp; HEADQUARTERS</text>
    <text x="20" y="52" font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="18" font-weight="600" fill="#f1f4f5">Lumberton, North Carolina</text>
  </g>
</svg>
