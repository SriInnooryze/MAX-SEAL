<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="pet-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="60%" stop-color="#211238"/>
      <stop offset="100%" stop-color="#4a154b"/>
    </linearGradient>
    <filter id="glow-pet"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#pet-bg)"/>
  <!-- Spherical Hydrocarbon Storage Tanks -->
  <circle cx="200" cy="260" r="110" fill="#1d1536" stroke="#ec4899" stroke-width="3"/>
  <circle cx="500" cy="240" r="130" fill="#1d1536" stroke="#ec4899" stroke-width="3"/>
  <!-- Tank Support Legs -->
  <line x1="120" y1="330" x2="100" y2="440" stroke="#ec4899" stroke-width="3"/>
  <line x1="280" y1="330" x2="300" y2="440" stroke="#ec4899" stroke-width="3"/>
  <line x1="400" y1="330" x2="370" y2="440" stroke="#ec4899" stroke-width="3"/>
  <line x1="600" y1="330" x2="630" y2="440" stroke="#ec4899" stroke-width="3"/>
  <!-- Violet Fluid Lines -->
  <path d="M 0 400 L 800 400" stroke="#a855f7" stroke-width="12" filter="url(#glow-pet)"/>
  <path d="M 200 150 L 200 400" stroke="#ec4899" stroke-width="6" stroke-dasharray="8,6"/>
  <!-- High Performance Valve Symbol -->
  <g transform="translate(500, 400)">
    <circle cx="0" cy="0" r="28" fill="#ec4899" stroke="#fff" stroke-width="3"/>
    <rect x="-10" y="-10" width="20" height="20" rx="4" fill="#fff"/>
  </g>
  <text x="400" y="470" text-anchor="middle" fill="#ec4899" font-family="monospace" font-size="14" letter-spacing="4">PETROCHEMICAL &amp; POLYMER SYNTHESIS</text>
</svg>