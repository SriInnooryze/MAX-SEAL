<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ref-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#331f06"/>
    </linearGradient>
    <filter id="glow-ref"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#ref-bg)"/>
  <!-- Distillation Towers -->
  <rect x="120" y="80" width="90" height="340" rx="45" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <rect x="260" y="120" width="110" height="300" rx="55" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <rect x="440" y="60" width="130" height="360" rx="65" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <!-- Tower rings -->
  <line x1="120" y1="140" x2="210" y2="140" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
  <line x1="120" y1="220" x2="210" y2="220" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
  <line x1="120" y1="300" x2="210" y2="300" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
  <line x1="440" y1="150" x2="570" y2="150" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
  <line x1="440" y1="250" x2="570" y2="250" stroke="#f59e0b" stroke-width="2" opacity="0.6"/>
  <!-- Interconnecting Process Pipes -->
  <path d="M 210 180 L 260 180" stroke="#fbbf24" stroke-width="8" filter="url(#glow-ref)"/>
  <path d="M 370 200 L 440 200" stroke="#fbbf24" stroke-width="8" filter="url(#glow-ref)"/>
  <path d="M 0 380 L 800 380" stroke="#d97706" stroke-width="12" filter="url(#glow-ref)"/>
  <!-- Pressure Gauge Indicator -->
  <g transform="translate(370, 380)">
    <circle cx="0" cy="0" r="26" fill="#d97706" stroke="#fff" stroke-width="3"/>
    <path d="M 0 0 L 12 -12" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="400" y="470" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="14" letter-spacing="4">PETROLEUM REFINING &amp; PROCESSING</text>
</svg>