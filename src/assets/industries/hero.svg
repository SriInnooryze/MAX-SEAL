  <path d="M 0 440 L 800 440" stroke="#f59e0b" stroke-width="6" filter="url(#glow-hero)"/>
  <path d="M 0 455 L 800 455" stroke="#10b981" stroke-width="4" filter="url(#glow-hero)"/>
  <text x="400" y="485" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="14" letter-spacing="5">ENGINEERED VALVES FOR GLOBAL INDUSTRIES</text>
