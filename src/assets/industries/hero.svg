  <rect width="800" height="500" fill="url(#hero-bg)"/>
  <!-- Industrial Skyline Combination -->
  <path d="M 0 380 L 120 380 L 150 200 L 220 200 L 250 380 L 320 380 L 360 140 L 440 140 L 480 380 L 600 380 L 630 240 L 700 240 L 730 380 L 800 380 L 800 500 L 0 500 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
