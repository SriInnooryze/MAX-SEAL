<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="50%" stop-color="#182232"/>
      <stop offset="100%" stop-color="#2d1607"/>
    </linearGradient>
    <linearGradient id="flare-glow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff4500"/>
      <stop offset="70%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow-og"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#og-bg)"/>
  <!-- Sea Horizon -->
  <rect x="0" y="320" width="800" height="180" fill="#06101c"/>
  <path d="M 0 320 Q 200 315 400 320 T 800 320" stroke="#ff6600" stroke-width="1.5" opacity="0.4"/>
  <!-- Offshore Oil Rig Silhouette -->
  <g fill="#131d2b" stroke="#ffaa00" stroke-width="1">
    <rect x="220" y="160" width="360" height="160" rx="4"/>
    <!-- Leg pillars -->
    <rect x="240" y="320" width="30" height="180"/>
    <rect x="360" y="320" width="30" height="180"/>
    <rect x="530" y="320" width="30" height="180"/>
    <!-- Derrick Tower -->
    <polygon points="370,160 430,160 415,40 385,40"/>
    <line x1="385" y1="40" x2="415" y2="160" stroke="#ffaa00" stroke-width="1.5"/>
    <line x1="415" y1="40" x2="385" y2="160" stroke="#ffaa00" stroke-width="1.5"/>
  </g>
  <!-- Flare Stack Stack & Flame -->
  <line x1="560" y1="160" x2="620" y2="30" stroke="#ff6600" stroke-width="4"/>
  <circle cx="625" cy="20" r="25" fill="url(#flare-glow)" filter="url(#glow-og)"/>
  <!-- High Pressure Pipeline with Valve Handwheel -->
  <path d="M 0 420 L 800 420" stroke="#ff8800" stroke-width="14" fill="none" filter="url(#glow-og)"/>
  <g transform="translate(400, 420)">
    <circle cx="0" cy="0" r="32" fill="#ff4500" stroke="#fff" stroke-width="4"/>
    <circle cx="0" cy="0" r="14" fill="#131d2b"/>
    <line x1="-32" y1="0" x2="32" y2="0" stroke="#fff" stroke-width="3"/>
    <line x1="0" y1="-32" x2="0" y2="32" stroke="#fff" stroke-width="3"/>
  </g>
  <text x="400" y="480" text-anchor="middle" fill="#ffaa00" font-family="monospace" font-size="14" letter-spacing="4">OIL &amp; GAS PRODUCTION &amp; REFINING</text>
</svg>