<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hvac-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1326"/>
      <stop offset="60%" stop-color="#172544"/>
      <stop offset="100%" stop-color="#042f4c"/>
    </linearGradient>
    <filter id="glow-hvac"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#hvac-bg)"/>
  <!-- Blue Chilled Water Pipe -->
  <path d="M 0 160 L 800 160" stroke="#0284c7" stroke-width="14" filter="url(#glow-hvac)"/>
  <!-- Red Condenser Water Pipe -->
  <path d="M 0 360 L 800 360" stroke="#ef4444" stroke-width="14" filter="url(#glow-hvac)"/>
  <!-- Centrifugal Chiller Compressor Unit -->
  <rect x="250" y="210" width="300" height="100" rx="12" fill="#0f1d38" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="340" cy="260" r="30" fill="#172544" stroke="#0284c7" stroke-width="3"/>
  <circle cx="460" cy="260" r="30" fill="#172544" stroke="#ef4444" stroke-width="3"/>
  <!-- Valve Controls -->
  <g transform="translate(160, 160)">
    <circle cx="0" cy="0" r="24" fill="#0284c7" stroke="#fff" stroke-width="3"/>
    <circle cx="0" cy="0" r="8" fill="#fff"/>
  </g>
  <g transform="translate(640, 360)">
    <circle cx="0" cy="0" r="24" fill="#ef4444" stroke="#fff" stroke-width="3"/>
    <circle cx="0" cy="0" r="8" fill="#fff"/>
  </g>
  <text x="400" y="470" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="14" letter-spacing="4">COMMERCIAL HVAC &amp; CHILLED WATER LOOPS</text>
</svg>