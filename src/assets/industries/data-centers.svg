<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020813"/>
      <stop offset="60%" stop-color="#07182e"/>
      <stop offset="100%" stop-color="#003865"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0055ff"/>
    </linearGradient>
    <filter id="glow-dc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#dc-bg)"/>
  <!-- Server Rack Corridors -->
  <g opacity="0.3">
    <line x1="0" y1="250" x2="800" y2="250" stroke="#00d2ff" stroke-width="1" stroke-dasharray="4,8"/>
    <line x1="400" y1="0" x2="400" y2="500" stroke="#00d2ff" stroke-width="1" stroke-dasharray="4,8"/>
  </g>
  <!-- Server Towers -->
  <rect x="70" y="70" width="180" height="360" rx="8" fill="#081424" stroke="#00d2ff" stroke-width="2"/>
  <rect x="310" y="70" width="180" height="360" rx="8" fill="#081424" stroke="#00d2ff" stroke-width="2"/>
  <rect x="550" y="70" width="180" height="360" rx="8" fill="#081424" stroke="#00d2ff" stroke-width="2"/>
  <!-- Cooling Pipes Overlay -->
  <path d="M 0 410 L 800 410" stroke="url(#cyan-glow)" stroke-width="12" fill="none" filter="url(#glow-dc)"/>
  <path d="M 0 90 L 800 90" stroke="url(#cyan-glow)" stroke-width="8" fill="none" opacity="0.8"/>
  <!-- Server LEDs -->
  <g fill="#00d2ff" filter="url(#glow-dc)">
    <circle cx="100" cy="110" r="4"/><circle cx="120" cy="110" r="4"/><circle cx="140" cy="110" r="4"/>
    <rect x="90" y="140" width="140" height="6" rx="3" fill="#00d2ff" opacity="0.6"/>
    <rect x="90" y="160" width="140" height="6" rx="3" fill="#0055ff" opacity="0.6"/>
    <rect x="90" y="180" width="140" height="6" rx="3" fill="#00d2ff" opacity="0.8"/>
    <circle cx="340" cy="110" r="4"/><circle cx="360" cy="110" r="4"/>
    <rect x="330" y="140" width="140" height="6" rx="3" fill="#0055ff" opacity="0.8"/>
    <circle cx="580" cy="110" r="4"/><circle cx="600" cy="110" r="4"/><circle cx="620" cy="110" r="4"/>
  </g>
  <!-- Cooling Water Loop Valve Symbol -->
  <g transform="translate(400, 410)" filter="url(#glow-dc)">
    <circle cx="0" cy="0" r="28" fill="#0055ff" stroke="#00d2ff" stroke-width="3"/>
    <path d="M -14 -10 L 14 10 M -14 10 L 14 -10" stroke="#fff" stroke-width="4"/>
  </g>
  <text x="400" y="470" text-anchor="middle" fill="#00d2ff" font-family="monospace" font-size="14" letter-spacing="4">DATA CENTER COOLING &amp; INFRASTRUCTURE</text>
</svg>