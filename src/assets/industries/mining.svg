<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="min-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180c06"/>
      <stop offset="60%" stop-color="#33180a"/>
      <stop offset="100%" stop-color="#542308"/>
    </linearGradient>
    <filter id="glow-min"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#min-bg)"/>
  <!-- Open Pit Mine Terraces -->
  <path d="M 0 100 L 800 100 M 0 180 L 800 180 M 0 260 L 800 260" stroke="#ea580c" stroke-width="1.5" opacity="0.3"/>
  <!-- Heavy Excavator Arm Crane Silhouette -->
  <path d="M 100 360 L 220 200 L 340 280 L 460 140" stroke="#f97316" stroke-width="8" fill="none" stroke-linecap="round"/>
  <polygon points="450,130 490,120 480,160" fill="#ea580c"/>
  <!-- Heavy Slurry Pipeline -->
  <path d="M 0 400 L 800 400" stroke="#ea580c" stroke-width="16" filter="url(#glow-min)"/>
  <!-- Abrasion-Resistant Slurry Valve Symbol -->
  <g transform="translate(600, 400)">
    <circle cx="0" cy="0" r="32" fill="#ea580c" stroke="#fff" stroke-width="4"/>
    <polygon points="-14,-14 14,0 -14,14" fill="#fff"/>
  </g>
  <text x="400" y="475" text-anchor="middle" fill="#f97316" font-family="monospace" font-size="14" letter-spacing="4">MINING, MINERALS &amp; HEAVY SLURRY</text>
</svg>