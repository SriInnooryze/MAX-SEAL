<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="pp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051614"/>
      <stop offset="60%" stop-color="#0e332e"/>
      <stop offset="100%" stop-color="#2d2207"/>
    </linearGradient>
    <filter id="glow-pp"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#pp-bg)"/>
  <!-- Industrial Paper Roll Rollers -->
  <circle cx="200" cy="220" r="80" fill="#0d2824" stroke="#14b8a6" stroke-width="4"/>
  <circle cx="400" cy="220" r="80" fill="#0d2824" stroke="#14b8a6" stroke-width="4"/>
  <circle cx="600" cy="220" r="80" fill="#0d2824" stroke="#14b8a6" stroke-width="4"/>
  <!-- Paper Sheet Web -->
  <path d="M 0 140 Q 200 130 400 140 T 800 140" stroke="#fef08a" stroke-width="6" fill="none" filter="url(#glow-pp)"/>
  <!-- Pulp Slurry Pipeline -->
  <path d="M 0 380 L 800 380" stroke="#14b8a6" stroke-width="12" filter="url(#glow-pp)"/>
  <!-- Slurry Valve Symbol -->
  <g transform="translate(400, 380)">
    <circle cx="0" cy="0" r="28" fill="#14b8a6" stroke="#fff" stroke-width="3"/>
    <rect x="-14" y="-6" width="28" height="12" rx="2" fill="#fff"/>
  </g>
  <text x="400" y="470" text-anchor="middle" fill="#14b8a6" font-family="monospace" font-size="14" letter-spacing="4">PULP, PAPER &amp; RECYCLED FIBER MILLS</text>
</svg>