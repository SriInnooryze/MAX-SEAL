<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ph-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <filter id="glow-ph"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#ph-bg)"/>
  <!-- Biotech Cleanroom Bioreactor Vessel -->
  <rect x="280" y="80" width="240" height="280" rx="50" fill="#1e1b4b" stroke="#818cf8" stroke-width="3"/>
  <!-- DNA Helix Overlay -->
  <path d="M 340 140 Q 400 200 460 140 T 340 260" stroke="#a5b4fc" stroke-width="3" fill="none" opacity="0.6" filter="url(#glow-ph)"/>
  <path d="M 460 140 Q 400 200 340 140 T 460 260" stroke="#818cf8" stroke-width="3" fill="none" opacity="0.6" filter="url(#glow-ph)"/>
  <!-- High Purity Dosing Pipeline -->
  <path d="M 0 410 L 800 410" stroke="#818cf8" stroke-width="10" filter="url(#glow-ph)"/>
  <!-- High Purity Valve Symbol -->
  <g transform="translate(400, 410)">
    <circle cx="0" cy="0" r="28" fill="#6366f1" stroke="#fff" stroke-width="3"/>
    <polygon points="0,-12 12,12 -12,12" fill="#fff"/>
  </g>
  <text x="400" y="475" text-anchor="middle" fill="#a5b4fc" font-family="monospace" font-size="14" letter-spacing="4">HIGH PURITY PHARMACEUTICALS &amp; BIOTECH</text>
</svg>