<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="pwr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101e"/>
      <stop offset="60%" stop-color="#15233b"/>
      <stop offset="100%" stop-color="#3b2406"/>
    </linearGradient>
    <filter id="glow-pwr"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#pwr-bg)"/>
  <!-- Cooling Towers -->
  <path d="M 140 380 Q 180 240 160 100 L 260 100 Q 240 240 280 380 Z" fill="#15233b" stroke="#f59e0b" stroke-width="2"/>
  <path d="M 520 380 Q 560 240 540 100 L 640 100 Q 620 240 660 380 Z" fill="#15233b" stroke="#f59e0b" stroke-width="2"/>
  <!-- Steam Plumes -->
  <ellipse cx="210" cy="80" rx="40" ry="20" fill="#ffffff" opacity="0.25" filter="url(#glow-pwr)"/>
  <ellipse cx="590" cy="80" rx="40" ry="20" fill="#ffffff" opacity="0.25" filter="url(#glow-pwr)"/>
  <!-- High Temp Steam Pipeline -->
  <path d="M 0 390 L 800 390" stroke="#f59e0b" stroke-width="14" filter="url(#glow-pwr)"/>
  <!-- Turbine Energy Arc -->
  <circle cx="400" cy="240" r="70" fill="#0f192b" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 370 240 L 430 240 M 400 210 L 400 270" stroke="#38bdf8" stroke-width="4" filter="url(#glow-pwr)"/>
  <!-- Severe Service Triple Offset Valve Symbol -->
  <g transform="translate(400, 390)">
    <circle cx="0" cy="0" r="30" fill="#f59e0b" stroke="#fff" stroke-width="3"/>
    <polygon points="-12,-16 16,0 -12,16" fill="#fff"/>
  </g>
  <text x="400" y="470" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="14" letter-spacing="4">POWER GENERATION &amp; STEAM LOOPS</text>
</svg>