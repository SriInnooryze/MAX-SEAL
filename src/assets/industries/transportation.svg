<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="tr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="60%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <filter id="glow-tr"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#tr-bg)"/>
  <!-- Rail Tanker Car Cylinders -->
  <rect x="120" y="160" width="240" height="140" rx="40" fill="#1f2937" stroke="#f59e0b" stroke-width="3"/>
  <rect x="440" y="160" width="240" height="140" rx="40" fill="#1f2937" stroke="#f59e0b" stroke-width="3"/>
  <!-- Wheels -->
  <circle cx="170" cy="320" r="20" fill="#374151" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="310" cy="320" r="20" fill="#374151" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="490" cy="320" r="20" fill="#374151" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="630" cy="320" r="20" fill="#374151" stroke="#f59e0b" stroke-width="2"/>
  <!-- Bulk Fluid Transfer Manifold -->
  <path d="M 0 410 L 800 410" stroke="#f59e0b" stroke-width="12" filter="url(#glow-tr)"/>
  <!-- Loading Arm Valve Symbol -->
  <g transform="translate(400, 410)">
    <circle cx="0" cy="0" r="28" fill="#f59e0b" stroke="#fff" stroke-width="3"/>
    <rect x="-12" y="-12" width="24" height="24" rx="4" fill="#fff"/>
  </g>
  <text x="400" y="475" text-anchor="middle" fill="#f59e0b" font-family="monospace" font-size="14" letter-spacing="4">BULK FLUID TRANSPORT &amp; TERMINALS</text>
</svg>