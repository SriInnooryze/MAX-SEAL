<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="mar-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021424"/>
      <stop offset="60%" stop-color="#082b4a"/>
      <stop offset="100%" stop-color="#03456c"/>
    </linearGradient>
    <filter id="glow-mar"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#mar-bg)"/>
  <!-- Ship Bow Hull Silhouette -->
  <path d="M -50 360 L 350 360 C 550 360 680 260 750 120 L 800 120 L 800 500 L -50 500 Z" fill="#051c30" stroke="#06b6d4" stroke-width="2"/>
  <!-- Ocean Wave Lines -->
  <path d="M 0 380 Q 200 360 400 380 T 800 380" stroke="#06b6d4" stroke-width="3" fill="none" opacity="0.7" filter="url(#glow-mar)"/>
  <!-- Seawater Ballast Pipe -->
  <path d="M 0 430 L 800 430" stroke="#0284c7" stroke-width="12" filter="url(#glow-mar)"/>
  <!-- Bronze Marine Valve Symbol -->
  <g transform="translate(350, 430)">
    <circle cx="0" cy="0" r="28" fill="#06b6d4" stroke="#fff" stroke-width="3"/>
    <path d="M -14 0 L 14 0 M 0 -14 L 0 14" stroke="#fff" stroke-width="4"/>
  </g>
  <text x="400" y="475" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="14" letter-spacing="4">MARINE, NAVAL &amp; OFFSHORE VESSELS</text>
</svg>